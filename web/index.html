<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente de Órdenes de Compra SAP</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1c2230; --mut:#667; --line:#dde1e8; --ok:#1e8e4e; --err:#c0392b; --acc:#2456d6; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 auto 0 0; }
  button { border:1px solid var(--line); background:var(--card); padding:6px 12px; border-radius:6px; cursor:pointer; font:inherit; }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  button:disabled { opacity:.5; cursor:default; }
  #banner { display:none; background:#ffe14d; color:#4a3b00; border-bottom:3px solid #e0b800; padding:10px 16px; font-weight:600; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:900px; padding:10px 14px; border-radius:10px; background:var(--card); border:1px solid var(--line); overflow-x:auto; }
  .msg.user { align-self:flex-end; background:#e3ecff; border-color:#c3d3fb; }
  .msg.error { border-color:var(--err); color:var(--err); }
  .tool { max-width:900px; border:1px solid var(--line); border-left:4px solid var(--ok); border-radius:6px; background:var(--card); font-size:13px; }
  .tool.err { border-left-color:var(--err); }
  .tool summary { padding:6px 10px; cursor:pointer; font-family:ui-monospace,monospace; }
  .tool pre { margin:0; padding:8px 10px; background:#f0f2f6; overflow-x:auto; white-space:pre-wrap; word-break:break-word; }
  table { border-collapse:collapse; margin:6px 0; }
  th, td { border:1px solid var(--line); padding:4px 8px; text-align:left; }
  th { background:#f0f2f6; }
  ul { margin:4px 0; padding-left:20px; }
  p { margin:4px 0; }
  form { display:flex; gap:8px; padding:12px 16px; background:var(--card); border-top:1px solid var(--line); }
  input { flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  #think { display:none; color:var(--mut); font-style:italic; padding:0 16px 6px; }
</style>
</head>
<body>
<header>
  <h1 id="titulo"></h1>
  <button id="nueva">Nueva sesión</button>
  <button id="reset">Reset out/</button>
</header>
<div id="banner">⚠ El agente pide tu confirmación. Responde "confirmo" para proceder o indica qué cambiar.</div>
<div id="log"></div>
<div id="think">pensando…</div>
<form id="f">
  <input id="txt" autocomplete="off" placeholder='Ej.: Procesa la solicitud "sol-001"'>
  <button class="primary" id="send">Enviar</button>
</form>
<script>
const RETO_TITULO = "Agente de Órdenes de Compra SAP"
document.getElementById("titulo").textContent = RETO_TITULO
document.title = RETO_TITULO

const $ = (id) => document.getElementById(id)
const nuevoId = () => "s-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)
let sessionId
try { sessionId = localStorage.getItem("sessionId") } catch {}
if (!sessionId) { sessionId = nuevoId(); try { localStorage.setItem("sessionId", sessionId) } catch {} }

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]))
const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>")

function md(texto) {
  const lineas = String(texto).split("\n")
  let out = "", i = 0
  while (i < lineas.length) {
    const l = lineas[i]
    if (/^\s*\|.*\|\s*$/.test(l)) {
      const filas = []
      while (i < lineas.length && /^\s*\|.*\|\s*$/.test(lineas[i])) filas.push(lineas[i++])
      const celdas = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim())
      const sep = filas.length > 1 && /^[\s|:-]+$/.test(filas[1])
      const cuerpo = filas.filter((_, k) => !(sep && k === 1))
      out += "<table>" + cuerpo.map((r, k) => "<tr>" + celdas(r).map((c) => (sep && k === 0 ? "<th>" : "<td>") + inline(c) + (sep && k === 0 ? "</th>" : "</td>")).join("") + "</tr>").join("") + "</table>"
    } else if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      out += "<ul>"
      while (i < lineas.length && /^\s*([-*]|\d+\.)\s+/.test(lineas[i])) out += "<li>" + inline(lineas[i++].replace(/^\s*([-*]|\d+\.)\s+/, "")) + "</li>"
      out += "</ul>"
    } else if (l.trim() === "") { i++ }
    else { out += "<p>" + inline(l.replace(/^#+\s*/, "")) + "</p>"; i++ }
  }
  return out
}

function agregar(clase, html) {
  const d = document.createElement("div")
  d.className = clase
  d.innerHTML = html
  $("log").appendChild(d)
  $("log").scrollTop = $("log").scrollHeight
}
function tarjeta(t) {
  const d = document.createElement("details")
  d.className = "tool" + (t.ok ? "" : " err")
  d.innerHTML = `<summary>${t.ok ? "✔" : "✖"} ${esc(t.nombre)} — ${esc(t.resumen)}</summary><pre>${esc("Argumentos: " + JSON.stringify(t.argumentos, null, 2))}\n\n${esc("Resultado: " + t.resumen)}</pre>`
  $("log").appendChild(d)
}

async function enviar(texto) {
  agregar("msg user", esc(texto))
  $("think").style.display = "block"; $("send").disabled = true
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sessionId, message: texto }) })
    const j = await r.json()
    if (!r.ok) throw new Error(j.error || "Error del servidor")
    j.toolCalls.forEach(tarjeta)
    agregar("msg", md(j.reply || "(sin respuesta)"))
    $("banner").style.display = j.needsConfirmation ? "block" : "none"
  } catch (e) {
    agregar("msg error", esc("Error: " + e.message))
  } finally {
    $("think").style.display = "none"; $("send").disabled = false; $("log").scrollTop = $("log").scrollHeight
  }
}

$("f").addEventListener("submit", (e) => { e.preventDefault(); const t = $("txt").value.trim(); if (t) { $("txt").value = ""; enviar(t) } })
$("nueva").onclick = () => { sessionId = nuevoId(); try { localStorage.setItem("sessionId", sessionId) } catch {} $("log").innerHTML = ""; $("banner").style.display = "none" }
$("reset").onclick = async () => { await fetch("/api/reset", { method: "POST" }); $("nueva").onclick() }

;(async () => {
  try {
    const r = await fetch("/api/sessions/" + encodeURIComponent(sessionId))
    if (!r.ok) return
    const s = await r.json()
    const porId = {}
    s.messages.forEach((m) => {
      if (m.role === "user" && !m.content.startsWith("[sistema]")) agregar("msg user", esc(m.content))
      else if (m.role === "assistant") {
        ;(m.toolCalls || []).forEach((c) => { let a = {}; try { a = JSON.parse(c.argumentos) } catch {} ; porId[c.id] = { nombre: c.nombre, argumentos: a } })
        if (m.content) agregar("msg", md(m.content))
      } else if (m.role === "tool") {
        const p = porId[m.toolCallId] || { nombre: m.name, argumentos: {} }
        let ok = true, res = m.content.slice(0, 200)
        try { const j = JSON.parse(m.content); ok = j.ok !== false; res = ok ? "ok" : j.error } catch {}
        tarjeta({ nombre: p.nombre, argumentos: p.argumentos, ok, resumen: res })
      }
    })
    $("banner").style.display = s.needsConfirmation ? "block" : "none"
  } catch {}
})()
</script>
</body>
</html>
